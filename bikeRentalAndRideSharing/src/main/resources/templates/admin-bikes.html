<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Manage Bikes</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
  <header>
    <h1>Bike Inventory</h1>
    <nav>
      <a th:href="@{/admin/dashboard}" class="btn-secondary">Back to Dashboard</a>
      <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </nav>
  </header>

  <div class="booking-table-container">
    <h2>Add New Bike</h2>
    <form th:action="@{/admin/bikes/add}" th:object="${newBike}" method="post" class="auth-form">
      <div class="form-group">
        <label>Brand</label>
        <input type="text" th:field="*{brand}" placeholder="Brand" required/>
      </div>
      <div class="form-group">
        <label>Model</label>
        <input type="text" th:field="*{model}" placeholder="Model" required/>
      </div>
      <div class="form-group">
        <label>Price Per Hour</label>
        <input type="number" th:field="*{pricePerHour}" placeholder="Price Per Hour" step="0.01" required/>
      </div>
      <div class="form-group">
        <label>Price Per Day</label>
        <input type="number" th:field="*{pricePerDay}" placeholder="Price Per Day" step="0.01" required/>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" th:field="*{location}" placeholder="Location" required/>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" th:field="*{imageURL}" placeholder="Image URL"/>
      </div>
      <button type="submit" class="btn-primary">Add Bike</button>
    </form>
  </div>

  <div class="booking-table-container" style="margin-top: 30px;">
    <h2>All Bikes</h2>
    <table class="styled-table">
      <tr>
        <th>ID</th>
        <th>Brand</th>
        <th>Model</th>
        <th>Status</th>
        <th>Price/Hour</th>
        <th>Price/Day</th>
        <th>Location</th>
        <th>Action</th>
      </tr>
      <tr th:each="bike : ${bikes}">
        <td th:text="${bike.bikeId}"></td>
        <td th:text="${bike.brand}"></td>
        <td th:text="${bike.model}"></td>
        <td>
                    <span class="status-badge" th:text="${bike.status}"
                          th:classappend="${bike.status == 'AVAILABLE'} ? 'available' : 'cancelled'">
                    </span>
        </td>
        <td th:text="${bike.pricePerHour}"></td>
        <td th:text="${bike.pricePerDay}"></td>
        <td th:text="${bike.location}"></td>
        <td>
          <a th:href="@{/admin/bikes/archive/{id}(id=${bike.bikeId})}" class="btn-cancel">Archive</a>
        </td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
