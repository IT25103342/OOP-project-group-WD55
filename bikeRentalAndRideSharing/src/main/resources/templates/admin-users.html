<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>All Users</h1>
        <nav>
            <a th:href="@{/admin/dashboard}" class="btn-secondary">Back to Dashboard</a>
            <a th:href="@{/logout}" class="btn-logout">Logout</a>
        </nav>
    </header>

    <div class="booking-table-container">
        <table class="styled-table">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Created</th>
                <th>Action</th>
            </tr>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span class="status-badge"
                          th:text="${user.role}"
                          th:classappend="${user.role == 'ADMIN'} ? 'pending' : 'available'">
                    </span>
                </td>
                <td th:text="${user.createdDate}"></td>
                <td>
                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn-cancel">Delete</a>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
