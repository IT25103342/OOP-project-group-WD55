<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Rides</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Active Rides</h1>
        <nav>
            <a th:href="@{/admin/dashboard}" class="btn-secondary">Back to Dashboard</a>
            <a th:href="@{/logout}" class="btn-logout">Logout</a>
        </nav>
    </header>

    <div class="booking-table-container">
        <table class="styled-table">
            <tr>
                <th>ID</th>
                <th>Poster</th>
                <th>Pickup</th>
                <th>Destination</th>
                <th>Ride Time</th>
                <th>Seats</th>
                <th>Status</th>
            </tr>
            <tr th:each="ride : ${rides}">
                <td th:text="${ride.id}"></td>
                <td th:text="${ride.posterName}"></td>
                <td th:text="${ride.pickupLocation}"></td>
                <td th:text="${ride.destinationLocation}"></td>
                <td th:text="${ride.rideTime}"></td>
                <td th:text="${ride.seatsAvailable}"></td>
                <td>
                    <span class="status-badge" th:text="${ride.status}"
                          th:classappend="${ride.status == 'OPEN'} ? 'open' : 'cancelled'">
                    </span>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
