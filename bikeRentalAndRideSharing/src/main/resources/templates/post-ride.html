<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Post a Ride</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
  <header>
    <h1>Post a New Ride</h1>
    <nav>
      <a th:href="@{/rides}" class="btn-secondary">Back to Rides</a>
      <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </nav>
  </header>

  <div class="auth-container" style="max-width: 600px; margin: 0 auto;">
    <form th:action="@{/rides/save}" th:object="${rideRequest}" method="post" class="auth-form">

      <div class="form-group">
        <label>Pickup Location</label>
        <input type="text" th:field="*{pickupLocation}" required/>
      </div>

      <div class="form-group">
        <label>Destination</label>
        <input type="text" th:field="*{destinationLocation}" required/>
      </div>

      <div class="form-group">
        <label>Ride Time</label>
        <input type="datetime-local" th:field="*{rideTime}" required/>
      </div>

      <div class="form-group">
        <label>Seats Available</label>
        <input type="number" th:field="*{seatsAvailable}" min="1" required/>
      </div>

      <div class="form-group">
        <label>Fee Per Seat ($)</label>
        <input type="number" th:field="*{feePerSeat}" step="0.01" placeholder="0.00"/>
      </div>

      <button type="submit" class="btn-primary">Post Ride</button>
      <a th:href="@{/rides}" class="btn-cancel" style="margin-left: 10px;">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
